[project]
name = "aether-reranker"
version = "0.1.0"
description = "Aether surgical reranker server — cross-encoder on Apple Silicon MPS"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "sentencepiece",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",   # for integration tests
    "pytest>=8.0.0",
]

[project.scripts]
aether-reranker = "reranker_server:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["reranker_server*"]
